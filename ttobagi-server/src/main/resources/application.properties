spring.config.import=optional:file:.env[.properties]

spring.application.name=ttobagi-server

# DB 연결 정보
spring.datasource.url=${TTOBAGI_DB_URL}
spring.datasource.username=${TTOBAGI_DB_USERNAME}
spring.datasource.password=${TTOBAGI_DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# AI
ai.server.url=${TTOBAGI_AI_SERVER}

# JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 파일 업로드 제한
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# JWT 설정
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# Email 설정
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 시스템 관리자 코드
system.admin-code=${SYSTEM_ADMIN_CODE}

# 주소
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Swagger 외부 설정
swagger.contact-name=${SWAGGER_CONTACT_NAME}
swagger.contact-email=${SWAGGER_CONTACT_EMAIL}
swagger.production-url=${SWAGGER_PRODUCTION_URL}